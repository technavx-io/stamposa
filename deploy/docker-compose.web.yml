# Web app — runs in a CloudStick web slot. The SAME image serves both
# stamposa.com (marketing) and app.stamposa.com (portals); the Next.js
# middleware splits by the incoming Host header. Deploy it in BOTH the
# "stamposawebsite" and "frontend-app" slots; each publishes on its own
# ${WEB_PORT} and CloudStick's nginx proxies that slot's domain to it.
#
#   ./deploy/deploy.sh web
#
# The web container is self-contained: it talks to the API over the public
# https://api.stamposa.com, so it needs neither Postgres nor the api network.

name: stamposa-web

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        # Baked in at build time — identical for both web slots.
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN}
        NEXT_PUBLIC_SITE_URL: https://${SITE_DOMAIN}
        NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN}
        NEXT_PUBLIC_DEFAULT_PHONE_REGION: ${DEFAULT_PHONE_REGION:-IN}
        NEXT_PUBLIC_SENTRY_DSN: ${WEB_SENTRY_DSN:-}
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-}
        NEXT_PUBLIC_GIT_SHA: ${GIT_SHA:-}
        NEXT_PUBLIC_BUILT_AT: ${BUILT_AT:-}
        NEXT_PUBLIC_PHONE_AUTH_ENABLED: ${PHONE_AUTH_ENABLED:-false}
    restart: unless-stopped
    # Localhost-only: CloudStick nginx proxies this slot's domain here.
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
