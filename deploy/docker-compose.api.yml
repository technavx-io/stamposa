# API stack — runs in the CloudStick "backend-api" app slot (api.stamposa.com).
# Contains the backend API plus YOUR Postgres + Redis (data stays on this
# server — not Neon). Publishes the API on localhost; CloudStick's nginx
# reverse-proxies api.stamposa.com → 127.0.0.1:${API_PORT}.
#
#   ./deploy/deploy.sh api

name: stamposa-api

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: loyalty
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env.production}
      POSTGRES_DB: loyalty_platform
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U loyalty -d loyalty_platform']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file: .env.production
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgresql://loyalty:${POSTGRES_PASSWORD}@postgres:5432/loyalty_platform?schema=public
      REDIS_URL: redis://redis:6379
      WEB_APP_URL: https://${APP_DOMAIN}
      API_PUBLIC_URL: https://${API_DOMAIN}
      # Browsers on BOTH the site and app hosts call the API.
      CORS_ORIGINS: https://${APP_DOMAIN},https://${SITE_DOMAIN}
      UPLOAD_DIR: ./uploads
      OTP_DEV_EXPOSE: 'false'
      APP_VERSION: ${APP_VERSION:-}
      GIT_SHA: ${GIT_SHA:-}
      BUILT_AT: ${BUILT_AT:-}
    # Localhost-only: CloudStick nginx proxies api.stamposa.com here.
    ports:
      - '127.0.0.1:${API_PORT:-4000}:4000'
    volumes:
      - uploads:/repo/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── One-off tool containers (deploy.sh runs these; build stage has Prisma CLI) ──
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      target: build
    profiles: ['tools']
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://loyalty:${POSTGRES_PASSWORD}@postgres:5432/loyalty_platform?schema=public
    working_dir: /repo
    command: ['npx', '-w', 'apps/api', 'prisma', 'migrate', 'deploy']
    depends_on:
      postgres:
        condition: service_healthy

  seed-admins:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      target: build
    profiles: ['tools']
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://loyalty:${POSTGRES_PASSWORD}@postgres:5432/loyalty_platform?schema=public
    working_dir: /repo
    command: ['npm', 'run', '-w', 'apps/api', 'prisma:seed:admins']
    depends_on:
      postgres:
        condition: service_healthy

  # DANGER: wipes ALL data and inserts demo tenants. Fresh installs only.
  seed:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      target: build
    profiles: ['tools']
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://loyalty:${POSTGRES_PASSWORD}@postgres:5432/loyalty_platform?schema=public
    working_dir: /repo
    command: ['npx', '-w', 'apps/api', 'prisma', 'db', 'seed']
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  uploads:
